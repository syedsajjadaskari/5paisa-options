[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trading-platform"
version = "0.1.0"
description = "Multi-Strategy Algorithmic Trading Research and Execution Platform for Indian Markets"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Quantitative Research Team" }
]
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "scipy>=1.14.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "duckdb>=1.0.0",
    "pyarrow>=18.0.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "tenacity>=8.3.0",
    "exchange-calendars>=4.5.0",
    "optuna>=4.0.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "matplotlib>=3.8.0",
    "plotly>=5.20.0",
    "streamlit>=1.35.0",
    "loguru>=0.7.0",
    "py5paisa>=0.7.21.2",
    "pypdf>=5.0.0",
    "pymupdf>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[project.scripts]
trading-platform = "trading_platform.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_platform"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
